# JVM args sized for a workstation build of a single tiny module.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Required by AGP 8+; the shell has no Kotlin sources but AGP still wants it set.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep the build honest: surface the deprecations instead of hiding them.
android.suppressUnsupportedCompileSdk=
