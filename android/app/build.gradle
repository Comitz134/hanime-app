// The shell itself. One activity, one updater, no third-party dependencies.
//
// VERSION_CODE is the number the updater compares against the server's
// /api/app/version. Bump it for every release; VERSION_NAME is display only.

plugins {
    id 'com.android.application'
}

// Release signing. The key must stay the same across releases or Android
// refuses to install the update over an existing install — it treats a
// different signer as a different app. keystore.properties is kept beside the
// project and is deliberately not in version control.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'app.hanime.shell'
    compileSdk 34

    defaultConfig {
        applicationId 'app.hanime.shell'
        minSdk 26          // adaptive icons + modern WebView APIs; Android 8.0+
        targetSdk 34
        versionCode 12
        versionName '1.0.11'

        // Where the updater asks for new builds. Empty means "no update source
        // configured": the check reports that instead of dialling a dead host.
        //
        // Two shapes are accepted at runtime, so the app is not tied to this
        // project's own proxy:
        //   a) any static *.json URL  (a folder rsynced to any file host)
        //   b) a base URL, in which case the app requests <base>/api/app/version
        // Override at build time with -PupdateUrl=...
        //
        // The default is this project's own GitHub release channel, because an
        // app that has to be handed an update URL before it will update itself
        // is not self-updating. Note the /releases/latest/ form: pinning the tag
        // (.../download/v1.0.3/version.json) would keep reporting 1.0.3 for ever
        // and never notice 1.0.4.
        def updateUrl = project.findProperty('updateUrl')
                ?: 'https://github.com/Comitz134/hanime-app/releases/latest/download/version.json'
        buildConfigField 'String', 'UPDATE_URL', '"' + updateUrl + '"'

        // The beta channel's manifest — consulted when the settings screen's
        // channel selector says beta. Like the stable URL it is a rolling
        // address that never moves; publish-github.mjs refreshes the asset it
        // points at on every publish, so switching to beta can never land on a
        // URL nobody has published yet. Override with -PbetaUrl=.
        buildConfigField 'String', 'BETA_URL',
                '"' + (project.findProperty('betaUrl') ?: 'https://github.com/Comitz134/hanime-app/releases/download/channel-beta/version.json') + '"'

        // Kept for the settings screen's "use the default" shortcut.
        buildConfigField 'String', 'DEFAULT_SERVER_URL',
                '"' + (project.findProperty('serverUrl') ?: 'http://10.0.2.2:8787') + '"'
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    // One dependency, and only for FileProvider: the self-updater has to hand
    // the downloaded APK to the system installer across a process boundary,
    // which is exactly what this provides. Everything else is the framework.
    implementation 'androidx.core:core:1.13.1'

    // Unit tests for the updater's pure source/channel selection — the logic
    // that decides which manifest a check consults, tested without a device —
    // and for the /api/anime handlers, whose JSON shaping is the contract the
    // client consumes. org.json is real on a device but a stub in a JVM test,
    // so the tests link the real implementation.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Surface the version the APK will actually carry, so a release is never
// published under a stale number.
tasks.register('printVersion') {
    doLast {
        println "versionCode=${android.defaultConfig.versionCode}"
        println "versionName=${android.defaultConfig.versionName}"
        println "applicationId=${android.defaultConfig.applicationId}"
    }
}
